<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 藝術學院｜AI Art Learning Studio</title>

  <style>
    :root {
      --bg: #eef2f7;
      --dark: #05070c;
      --glass: rgba(255, 255, 255, 0.22);
      --glass-dark: rgba(8, 10, 18, 0.72);
      --border: rgba(255, 255, 255, 0.55);
      --text: #f8fafc;
      --muted: rgba(255,255,255,0.72);
      --black: #05070c;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --pink: #ec4899;
      --violet: #8b5cf6;
      --gold: #facc15;
      --green: #22c55e;
      --radius: 34px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Inter", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(34,211,238,0.25), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(236,72,153,0.23), transparent 26%),
        radial-gradient(circle at 70% 80%, rgba(139,92,246,0.24), transparent 30%),
        linear-gradient(135deg, #eef2f7, #cfd8e3);
      color: var(--black);
      line-height: 1.75;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.38);
      backdrop-filter: blur(24px) saturate(150%);
      border-bottom: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }

    .nav {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.12em;
      font-size: 0.9rem;
      color: #0b1020;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      color: rgba(5,7,12,0.72);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #000;
    }

    .hero {
      padding: 118px 0 92px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 56px;
      align-items: center;
    }

    .eyebrow {
      color: #7c3aed;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.78rem;
      margin-bottom: 22px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(3.3rem, 7vw, 6.8rem);
      line-height: 0.96;
      letter-spacing: -0.075em;
      margin-bottom: 30px;
      color: #05070c;
    }

    .hero p {
      color: rgba(5,7,12,0.68);
      font-size: 1.16rem;
      max-width: 720px;
      margin-bottom: 34px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.68);
      background: rgba(255,255,255,0.38);
      backdrop-filter: blur(18px) saturate(170%);
      color: #0b1020;
      font-weight: 800;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.8),
        inset 0 -12px 28px rgba(0,0,0,0.15),
        0 18px 38px rgba(0,0,0,0.18);
      transition: 0.3s ease;
    }

    .btn.primary {
      background:
        linear-gradient(135deg, rgba(34,211,238,0.85), rgba(139,92,246,0.85));
      color: white;
      text-shadow: 0 1px 8px rgba(0,0,0,0.35);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.9),
        inset 0 -12px 30px rgba(0,0,0,0.2),
        0 24px 50px rgba(0,0,0,0.24);
    }

    .liquid-panel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.65);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.42), rgba(255,255,255,0.12)),
        linear-gradient(135deg, rgba(15,23,42,0.88), rgba(15,23,42,0.54));
      backdrop-filter: blur(28px) saturate(180%);
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.85),
        inset 0 -28px 52px rgba(0,0,0,0.38),
        0 28px 80px rgba(0,0,0,0.28);
    }

    .hero-visual {
      min-height: 540px;
      padding: 38px;
      display: flex;
      align-items: end;
    }

    .hero-visual::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 28px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 38px 38px;
      opacity: 0.55;
    }

    .hero-visual::after {
      content: "";
      position: absolute;
      width: 290px;
      height: 120px;
      right: 12%;
      top: 14%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 25% 40%, rgba(34,211,238,0.75), transparent 35%),
        radial-gradient(circle at 70% 45%, rgba(236,72,153,0.7), transparent 38%);
      filter: blur(22px);
      opacity: 0.85;
    }

    .visual-caption {
      position: relative;
      z-index: 2;
      color: white;
    }

    .visual-caption span {
      color: #67e8f9;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .visual-caption h3 {
      font-size: 1.8rem;
      margin-top: 10px;
    }

    .visual-caption p {
      color: rgba(255,255,255,0.75);
      margin: 8px 0 0;
    }

    section {
      padding: 78px 0;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 28px;
      margin-bottom: 36px;
    }

    .section-title h2 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      letter-spacing: -0.055em;
      color: #05070c;
    }

    .section-title p {
      color: rgba(5,7,12,0.65);
      max-width: 560px;
      font-size: 1.03rem;
    }

    .grid {
      display: grid;
      gap: 24px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      padding: 32px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.46), rgba(255,255,255,0.14)),
        rgba(5,7,12,0.62);
      border: 1px solid rgba(255,255,255,0.58);
      backdrop-filter: blur(24px) saturate(175%);
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.85),
        inset 0 -22px 42px rgba(0,0,0,0.36),
        0 24px 60px rgba(0,0,0,0.18);
      color: white;
      transition: 0.35s ease;
    }

      position: absolute;
